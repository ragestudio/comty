name: Server

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Server
    runs-on: ubuntu-latest
    env:
      IS_ACTION_RUNNER: true
    steps:
      # the server only needs linebridge, avoid fetching the private
      # desktop submodules (sysaudio) during checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout linebridge submodule
        run: git submodule update --init modules/linebridge

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ragestudio/comty-server
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-
            type=raw,value={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ULTRAGATEWAY_VERSION=${{ vars.ULTRAGATEWAY_VERSION }}
          push: true
