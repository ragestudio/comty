name: App

on:
  workflow_call:
    secrets:
      GITEA_GIT_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      # the sysaudio submodule lives on a private gitea instance, so the token
      # is injected through an url rewrite before checkout fetches submodules
      - name: Configure git auth for private submodules
        env:
          GITEA_USER: ${{ vars.GITEA_USER || 'oauth2' }}
          GITEA_GIT_TOKEN: ${{ secrets.GITEA_GIT_TOKEN }}
        run: |
          if [ -z "${GITEA_GIT_TOKEN}" ]; then
            echo "::error::GITEA_GIT_TOKEN is required to clone private submodules from git.ragestudio.net"
            exit 1
          fi

          git config --global url."https://${GITEA_USER}:${GITEA_GIT_TOKEN}@git.ragestudio.net/".insteadOf "https://git.ragestudio.net/"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # only the web app and its workspace dependencies are needed
        run: pnpm install --filter "@comty/app..."

      # the package ships no dist in the repository and it is resolved at runtime
      - name: Build linebridge client
        run: pnpm --filter @linebridge/client build

      - name: Build App
        run: pnpm --filter @comty/app build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: ./packages/app/dist/
          if-no-files-found: error
