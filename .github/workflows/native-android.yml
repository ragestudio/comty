name: Native Android

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "android-*"

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # vessel and sysaudio are only needed by the web/desktop apps, and
      # linebridge's uWebSockets submodule is only used by the server engine
      - name: Checkout submodules
        run: git submodule update --init modules/comty.js modules/linebridge

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --filter "@comty/native-app..." --filter "@linebridge/client"

      # the package ships no dist in the repository and it is resolved at runtime
      - name: Build linebridge client
        run: pnpm --filter @linebridge/client build

      - name: Generate Android project
        run: pnpm --filter @comty/native-app exec expo prebuild --platform android --clean --no-install

      # the gradle cache needs the project files generated by expo prebuild
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease
        working-directory: ./packages/native/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: native-android-apk
          path: ./packages/native/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
