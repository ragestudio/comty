name: Release

on:
  push:
    tags:
      - "rel-*"

permissions:
  id-token: write
  attestations: write
  contents: write
  issues: write
  discussions: write
  pull-requests: write

jobs:
  check_versions:
    name: Check Version Changes
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.check.outputs.app_changed }}
      server_changed: ${{ steps.check.outputs.server_changed }}
      native_changed: ${{ steps.check.outputs.native_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y curl jq

      - name: Check version changes
        id: check
        run: |
          # Get current versions
          APP_VERSION=$(jq -r '.version' ./packages/app/package.json)
          SERVER_VERSION=$(jq -r '.version' ./packages/server/package.json)
          NATIVE_VERSION=$(jq -r '.version' ./packages/native/package.json)
          echo "Current app version: $APP_VERSION"
          echo "Current server version: $SERVER_VERSION"
          echo "Current native version: $NATIVE_VERSION"

          # Get latest release using GitHub API
          REPO_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          RELEASE_INFO=$(curl -s -H "Accept: application/vnd.github.v3+json" "$REPO_URL" || echo "{}")

          # Check if we got a valid response
          if [[ $(echo "$RELEASE_INFO" | jq -r '.tag_name // empty') == "" ]]; then
            echo "No previous releases found - all components need build"
            echo "app_changed=true" >> $GITHUB_OUTPUT
            echo "server_changed=true" >> $GITHUB_OUTPUT
            echo "native_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract tag name
          TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name')
          echo "Latest release tag: $TAG"

          # Download versions.json from the release assets
          ASSET_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name == "versions.json") | .browser_download_url // empty')

          if [[ -n "$ASSET_URL" ]]; then
            curl -s -L -o versions.json "$ASSET_URL" || true
          else
            curl -s -L -o versions.json "https://github.com/${{ github.repository }}/releases/latest/download/versions.json" || true
          fi

          if [[ ! -f "versions.json" ]]; then
            echo "versions.json not found in latest release - all components need build"
            echo "app_changed=true" >> $GITHUB_OUTPUT
            echo "server_changed=true" >> $GITHUB_OUTPUT
            echo "native_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Read versions from latest release
          LATEST_APP=$(jq -r '.app // empty' versions.json)
          LATEST_SERVER=$(jq -r '.server // empty' versions.json)
          LATEST_NATIVE=$(jq -r '.native // empty' versions.json)
          echo "Latest app version: $LATEST_APP"
          echo "Latest server version: $LATEST_SERVER"
          echo "Latest native version: $LATEST_NATIVE"

          # Compare versions
          if [[ "$APP_VERSION" == "$LATEST_APP" ]]; then
            echo "app_changed=false" >> $GITHUB_OUTPUT
          else
            echo "app_changed=true" >> $GITHUB_OUTPUT
          fi

          if [[ "$SERVER_VERSION" == "$LATEST_SERVER" ]]; then
            echo "server_changed=false" >> $GITHUB_OUTPUT
          else
            echo "server_changed=true" >> $GITHUB_OUTPUT
          fi

          if [[ "$NATIVE_VERSION" == "$LATEST_NATIVE" ]]; then
            echo "native_changed=false" >> $GITHUB_OUTPUT
          else
            echo "native_changed=true" >> $GITHUB_OUTPUT
          fi

  build_app:
    name: Build App
    needs: check_versions
    if: needs.check_versions.outputs.app_changed == 'true'
    uses: ./.github/workflows/app.yml
    secrets: inherit

  build_server:
    name: Build Server
    needs: check_versions
    if: needs.check_versions.outputs.server_changed == 'true'
    uses: ./.github/workflows/server.yml
    secrets: inherit

  build_native:
    name: Build Native Android
    needs: check_versions
    if: needs.check_versions.outputs.native_changed == 'true'
    uses: ./.github/workflows/native-android.yml
    secrets: inherit

  create_release:
    name: Create GitHub Release
    needs: [check_versions, build_app, build_server, build_native]
    # server and native failures must not block the release
    if: |
      !cancelled() && startsWith(github.ref, 'refs/tags/') &&
      needs.build_app.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download App Artifact
        if: needs.check_versions.outputs.app_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: ./app-release-files

      - name: Zip Artifact
        if: needs.check_versions.outputs.app_changed == 'true'
        run: zip -r dist.zip ./app-release-files

      - name: Download Android APK
        if: needs.check_versions.outputs.native_changed == 'true' && needs.build_native.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: native-android-apk
          path: ./native-release-files

      - name: Rename Android APK
        if: needs.check_versions.outputs.native_changed == 'true' && needs.build_native.result == 'success'
        run: mv ./native-release-files/*.apk ./spaces-android.apk

      - name: Generate Versions JSON
        run: |
          APP_VERSION=$(jq -r '.version' ./packages/app/package.json)
          SERVER_VERSION=$(jq -r '.version' ./packages/server/package.json)
          NATIVE_VERSION=$(jq -r '.version' ./packages/native/package.json)
          jq -n --arg tag "${{ github.ref_name }}" --arg app "$APP_VERSION" --arg server "$SERVER_VERSION" --arg native "$NATIVE_VERSION" '{tag: $tag, app: $app, server: $server, native: $native}' > versions.json

      - name: Prepare release files
        id: prepare_release
        run: |
          RELEASE_FILES="versions.json"
          if [[ -f "dist.zip" ]]; then
            RELEASE_FILES=$(printf "%s\n%s" "$RELEASE_FILES" "dist.zip")
          fi
          if [[ -f "spaces-android.apk" ]]; then
            RELEASE_FILES=$(printf "%s\n%s" "$RELEASE_FILES" "spaces-android.apk")
          fi
          echo "release_files<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_release.outputs.release_files }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
