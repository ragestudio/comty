name: Release Spaces SDK

on:
    workflow_dispatch:
    push:
        tags:
            - "spsdk-*"

permissions:
    contents: write
    id-token: write

concurrency:
    group: spaces-sdk-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        name: Publish @comty/spaces-sdk
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # the sdk depends on workspace packages living in these submodules
            - name: Checkout submodules
              run: git submodule update --init modules/comty.js modules/linebridge

            - name: Install pnpm
              uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
              with:
                  version: 11

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --filter "@comty/spaces-sdk..."

            - name: Build workspace dependencies
              run: |
                  pnpm --filter comty.js build
                  pnpm --filter @linebridge/client build

            - name: Build spaces sdk
              run: pnpm --filter @comty/spaces-sdk build

            - name: Publish spaces sdk
              run: pnpm --filter @comty/spaces-sdk publish --no-git-checks --provenance
